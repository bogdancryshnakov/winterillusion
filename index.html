<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>666</title>
    <style>
        /* Обнуляем отступы и задаём базовый фон */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f5f7fa 0%, #e9edf2 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 20px;
        }

        /* Карточка-контейнер — приятная тень, скругления */
        .player-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 30px 25px 25px 25px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.25),
                        inset 0 1px 2px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            max-width: 420px;
            width: 100%;
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 60px -12px rgba(0, 0, 0, 0.3);
        }

        /* Заголовок — аккуратный, с иконкой */
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-left: 6px;
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1e2b;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #2b2f3f 0%, #3d4257 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge {
            background: #3d3f4b;
            color: white;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 40px;
            letter-spacing: 0.4px;
            background: rgba(30, 32, 44, 0.08);
            color: #2c303e;
            border: 1px solid rgba(0, 0, 0, 0.04);
            backdrop-filter: blur(2px);
        }

        /* Обёртка для iframe — сохраняем пропорции и убираем возможные переполнения */
        .iframe-wrapper {
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            background: #ffffff;
            transition: box-shadow 0.3s ease;
            line-height: 0; /* убирает лишний отступ снизу */
        }

        .iframe-wrapper iframe {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 370 / 400; /* точно соответствует пропорциям 370x400 */
            max-width: 100%;
            border: none;
            background: #ffffff;
        }

        /* Маленький футер с подписью — опционально, для атмосферы */
        .card-footer {
            margin-top: 18px;
            text-align: right;
            font-size: 0.75rem;
            color: #6e768a;
            letter-spacing: 0.2px;
            padding-right: 6px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .card-footer:hover {
            opacity: 1;
        }

        .card-footer span {
            background: rgba(0, 0, 0, 0.02);
            padding: 2px 12px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Адаптивность для узких экранов */
        @media (max-width: 480px) {
            .player-card {
                padding: 20px 16px 18px 16px;
                border-radius: 32px;
            }
            .card-header h2 {
                font-size: 1.2rem;
            }
            .badge {
                font-size: 0.6rem;
                padding: 2px 10px;
            }
        }

        /* Для совсем маленьких экранов сохраняем читаемость */
        @media (max-width: 400px) {
            .player-card {
                padding: 16px 12px 14px 12px;
            }
            .iframe-wrapper {
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="player-card">
        <!-- шапка с названием и "бейджем" -->
        <div class="card-header">
            <h2>🎵 6ОГДАШ6 КР6Ш</h2>
            <span class="badge">live</span>
        </div>

        <!-- сам iframe — ваш код, без изменений -->
        <div class="iframe-wrapper">
            <iframe 
                allowfullscreen="true" 
                width="370" 
                height="400" 
                src="https://band.link/bogdasha666/iframe?youtube_enabled=1&header=1&title=1&theme=light&player_enabled=undefined&picture=1&footer=0" 
                frameborder="0" 
                scrolling="no">
            </iframe>
        </div>

        <!-- маленькая подпись внизу (можно убрать, но с ней уютнее) -->
        <div class="card-footer">
            <span>✦ band.link · пресейв фастом</span>
        </div>
    </div>
</body>
</html>
